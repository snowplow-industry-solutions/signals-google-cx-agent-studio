openapi: 3.0.3
info:
  title: Atelier Signals - Search Catalog
  description: >
    Searches the storefront's product catalog so the agent can turn
    behavioural context into concrete, actionable recommendations.
  version: "1.0.0"
servers:
  - url: https://your-storefront.example.com
    description: Production (Vercel deploy of storefront/)
security:
  - ApiKeyAuth: []
paths:
  /api/agent/catalog:
    get:
      operationId: searchCatalog
      summary: Search the product catalog with optional filters
      description: >
        All parameters are optional and combinable (AND semantics).
        Invalid `max_price` or `limit` values are ignored/defaulted rather
        than rejected. Results are capped at 25 and default to 10.
      parameters:
        - name: category
          in: query
          required: false
          description: Exact match, case-insensitive.
          schema:
            type: string
            enum:
              [Outerwear, Tailoring, Knitwear, Dresses, Accessories, Bags, Shoes, Watches]
        - name: designer
          in: query
          required: false
          description: Exact match, case-insensitive.
          schema:
            type: string
        - name: occasion
          in: query
          required: false
          description: Exact match, case-insensitive.
          schema:
            type: string
            enum: [City, Evening, Resort, Winter, Workwear]
        - name: color
          in: query
          required: false
          description: Exact match, case-insensitive, on the product's color family.
          schema:
            type: string
            enum: [Black, Ivory, Camel, Burgundy, Silver, Navy, Olive]
        - name: max_price
          in: query
          required: false
          description: Upper bound (inclusive), in USD.
          schema:
            type: number
        - name: query
          in: query
          required: false
          description: >
            Free-text, case-insensitive substring match against the
            product name and description.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max results to return. Defaults to 10, capped at 25.
          schema:
            type: integer
            default: 10
            maximum: 25
        - $ref: "#/components/parameters/ChatSessionIdHeader"
        - $ref: "#/components/parameters/SnowplowSessionIdHeader"
        - $ref: "#/components/parameters/SnowplowUserIdHeader"
        - $ref: "#/components/parameters/TurnIdHeader"
      responses:
        "200":
          description: Matching products (empty array if nothing matches).
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogResult"
        "401":
          description: Missing or incorrect `x-agent-api-key` header.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-agent-api-key
  parameters:
    ChatSessionIdHeader:
      name: x-ces-session-id
      in: header
      required: false
      description: >
        CX Agent Studio's own conversation session id, injected from the
        built-in session context (not model-produced). Threads this event
        to the conversation's other tool calls and self-tracking events.
      schema:
        type: string
      x-ces-session-context: $context.session_id
    SnowplowSessionIdHeader:
      name: x-snowplow-session-id
      in: header
      required: false
      description: >
        The shopper's Snowplow session identifier (`domain_sessionid`).
        Injected from the `snowplow_session_id` agent variable (not
        model-produced); see `docs/setup-cx-agent-studio.md`.
      schema:
        type: string
      x-ces-session-context: $context.variables.snowplow_session_id
    SnowplowUserIdHeader:
      name: x-snowplow-user-id
      in: header
      required: false
      description: >
        The shopper's Snowplow domain user id. Injected from the
        `snowplow_user_id` agent variable (not model-produced).
      schema:
        type: string
      x-ces-session-context: $context.variables.snowplow_user_id
    TurnIdHeader:
      name: x-snowplow-turn-id
      in: header
      required: false
      description: >
        Per-turn id minted by the chat widget at send time. Injected from
        the `snowplow_turn_id` agent variable (not model-produced); used as
        this event's invocation id so tool calls and self-tracking events
        from the same turn share an id.
      schema:
        type: string
      x-ces-session-context: $context.variables.snowplow_turn_id
  schemas:
    CatalogResult:
      type: object
      required: [name, designer, category, occasion, color, price, url, image]
      properties:
        name:
          type: string
        designer:
          type: string
        category:
          type: string
        occasion:
          type: string
        color:
          type: string
        price:
          type: number
        url:
          type: string
          description: Site-relative product page path, e.g. `/products/camel-cashmere-wrap-coat`.
        image:
          type: string
          description: >
            Absolute product image URL. Source data for the productCarousel /
            productDetails rich response widgets (see agent/instructions.md
            'Rich response widgets') --
            ground every widget image in this field, never an invented URL.
