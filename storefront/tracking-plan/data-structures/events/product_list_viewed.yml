apiVersion: v1
resourceType: data-structure
meta:
  hidden: false
  schemaType: event
  customData: {}
data:
  $schema: http://iglucentral.com/schemas/com.snowplowanalytics.self-desc/schema/jsonschema/1-0-0#
  description: Marker event for a merchandising rail, collection grid, or editorial list being viewed.
  self:
    vendor: com.snowplow_demo.fashion
    name: product_list_viewed
    format: jsonschema
    version: 1-0-0
  type: object
  properties:
    list_id:
      type: string
      maxLength: 128
      description: Stable identifier for the merchandised list.
    list_name:
      type: string
      maxLength: 256
      description: Human-readable name of the merchandised list.
    list_type:
      type: string
      maxLength: 64
      description: Placement type such as homepage, collection, or product detail.
    product_count:
      type: integer
      minimum: 0
      maximum: 1000
      description: Number of products shown in the list at render time.
  required:
    - list_id
    - list_name
    - list_type
    - product_count
  additionalProperties: false
