apiVersion: v1
resourceType: data-structure
meta:
  hidden: false
  schemaType: entity
  customData: {}
data:
  $schema: http://iglucentral.com/schemas/com.snowplowanalytics.self-desc/schema/jsonschema/1-0-0#
  description: Snapshot of the cart when a cart or checkout event is emitted.
  self:
    vendor: com.snowplow_demo.fashion
    name: cart
    format: jsonschema
    version: 1-0-0
  type: object
  properties:
    cart_line_count:
      type: integer
      minimum: 0
      maximum: 1000
      description: Number of line items in the cart.
    cart_value:
      type: number
      minimum: 0
      maximum: 100000
      description: Current monetary total of the cart.
    currency:
      type: string
      maxLength: 3
      description: ISO currency code.
  required:
    - cart_line_count
    - cart_value
    - currency
  additionalProperties: false
