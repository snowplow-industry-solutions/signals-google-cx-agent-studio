apiVersion: v1
resourceType: data-structure
meta:
  hidden: false
  schemaType: event
  customData: {}
data:
  $schema: http://iglucentral.com/schemas/com.snowplowanalytics.self-desc/schema/jsonschema/1-0-0#
  description: Marker event for add-to-cart, remove-from-cart, or quantity changes.
  self:
    vendor: com.snowplow_demo.fashion
    name: cart_updated
    format: jsonschema
    version: 1-0-1
  type: object
  properties:
    action:
      type: string
      description: The cart mutation performed by the shopper.
      enum:
        - add_to_cart
        - remove_from_cart
        - adjust_quantity
    product_id:
      type: string
      maxLength: 128
      description: Stable identifier of the product affected by the cart update.
    quantity:
      type: integer
      minimum: 0
      maximum: 1000
      description: Quantity of the affected product after the mutation.
    cart_line_count:
      type: integer
      minimum: 0
      maximum: 1000
      description: Number of distinct line items in the cart after the mutation.
  required:
    - action
    - product_id
    - quantity
    - cart_line_count
  additionalProperties: false
