apiVersion: v1
resourceType: data-structure
meta:
  hidden: false
  schemaType: event
  customData: {}
data:
  $schema: http://iglucentral.com/schemas/com.snowplowanalytics.self-desc/schema/jsonschema/1-0-0#
  description: Marker event for completing the demo checkout flow.
  self:
    vendor: com.snowplow_demo.fashion
    name: checkout_completed
    format: jsonschema
    version: 1-0-0
  type: object
  properties:
    order_value:
      type: number
      minimum: 0
      maximum: 100000
      description: Final order value captured at checkout completion.
    currency:
      type: string
      maxLength: 3
      description: ISO currency code for the completed order.
    item_count:
      type: integer
      minimum: 0
      maximum: 1000
      description: Total item count in the completed order.
  required:
    - order_value
    - currency
    - item_count
  additionalProperties: false
