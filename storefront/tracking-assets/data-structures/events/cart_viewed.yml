apiVersion: v1
resourceType: data-structure
meta:
  hidden: false
  schemaType: event
  customData: {}
data:
  $schema: http://iglucentral.com/schemas/com.snowplowanalytics.self-desc/schema/jsonschema/1-0-0#
  description: Marker event for viewing the cart page or cart drawer.
  self:
    vendor: com.snowplow_demo.fashion
    name: cart_viewed
    format: jsonschema
    version: 1-0-0
  type: object
  properties:
    cart_line_count:
      type: integer
      minimum: 0
      maximum: 1000
      description: Number of line items currently in the cart.
    cart_value:
      type: number
      minimum: 0
      maximum: 100000
      description: Monetary value of the current cart.
    currency:
      type: string
      maxLength: 3
      description: ISO currency code for the cart value.
    cart_value_band:
      type: string
      maxLength: 32
      description: Demo-friendly bucket used to describe the cart as entry, considered, or luxury.
  required:
    - cart_line_count
    - cart_value
    - currency
    - cart_value_band
  additionalProperties: false
