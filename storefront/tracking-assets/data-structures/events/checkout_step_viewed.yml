apiVersion: v1
resourceType: data-structure
meta:
  hidden: false
  schemaType: event
  customData: {}
data:
  $schema: http://iglucentral.com/schemas/com.snowplowanalytics.self-desc/schema/jsonschema/1-0-0#
  description: Marker event for a shopper viewing a specific checkout step.
  self:
    vendor: com.snowplow_demo.fashion
    name: checkout_step_viewed
    format: jsonschema
    version: 1-0-0
  type: object
  properties:
    checkout_step:
      type: string
      maxLength: 32
      description: Name of the checkout step viewed by the shopper.
    cart_line_count:
      type: integer
      minimum: 0
      maximum: 1000
      description: Number of line items present while this checkout step is viewed.
  required:
    - checkout_step
    - cart_line_count
  additionalProperties: false
