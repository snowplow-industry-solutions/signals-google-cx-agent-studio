apiVersion: v1
resourceType: data-product
resourceName: 12361c29-df6c-5a64-b024-68557f6504ed
data:
  name: Atelier Signals Ecommerce Demo
  domain: Product
  description: >
    Demonstration data product for a luxury fashion ecommerce storefront using Snowplow
    Signals to personalize editorial modules, product recommendations, cart styling,
    and checkout reassurance in-session.
  owner: demo-owner@example.com
  sourceApplications:
    - $ref: ./source-applications/fashion_storefront.yml
    - $ref: ./source-applications/fashion_storefront_agent.yml
  eventSpecifications:
    - resourceName: a71ae6fc-8dd2-5383-87b1-c30bc221ce3d
      name: Product list viewed
      description: Fires when a merchandising rail, homepage feature grid, or collection listing is viewed.
      triggers:
        - id: 8c01f009-5e14-43db-8922-9c391ebba9bc
          description: Trigger on homepage featured rails and collection grids after products are rendered.
          appIds:
            - atelier-storefront
      event:
        source: iglu:com.snowplow_demo.fashion/product_list_viewed/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow_demo.fashion/product/jsonschema/1-0-0
            minCardinality: 1
        enriched: []
    - resourceName: ea58ab89-bde5-5b0c-ac90-97db70e2e96b
      name: Product list clicked
      description: Fires when a shopper selects a product from a collection or curated rail.
      triggers:
        - id: 714295e9-9307-4303-b261-bf184d5ddddc
          description: Trigger when a product card link is clicked from any tracked list.
          appIds:
            - atelier-storefront
        - id: 6862710c-686f-4ba3-878f-fd994f8ff966
          description: >
            Trigger when a shopper clicks a concierge-rendered product card
            in the chat widget (list id concierge_recommendations), tracked
            client-side through the generated Snowtype helper.
          appIds:
            - atelier-storefront
      event:
        source: iglu:com.snowplow_demo.fashion/product_list_clicked/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow_demo.fashion/product/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: 8885118e-ea72-589f-8512-6047b3f9cef2
      name: Product viewed
      description: Fires on product detail page loads for fashion items.
      triggers:
        - id: 48cc8b20-2d7e-46dd-95d4-7780dbf5de30
          description: Trigger when a product detail page becomes visible to the shopper.
          appIds:
            - atelier-storefront
      event:
        source: iglu:com.snowplow_demo.fashion/product_viewed/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow_demo.fashion/product/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: 867cbc41-dd2b-5a55-8a2e-4b093b985aec
      name: Cart viewed
      description: Fires when the shopper opens the dedicated cart experience.
      triggers:
        - id: d463f23c-7f6f-451e-9268-5bdcc8185080
          description: Trigger on cart page view to support cart-state Signals attributes.
          appIds:
            - atelier-storefront
      event:
        source: iglu:com.snowplow_demo.fashion/cart_viewed/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow_demo.fashion/cart/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/product/jsonschema/1-0-0
            minCardinality: 0
        enriched: []
    - resourceName: e7116964-2c08-5764-a67b-a75dca2546f8
      name: Cart updated
      description: Fires when an item is added, removed, or updated in the cart.
      triggers:
        - id: 727418fa-a85a-4bea-b9b9-94872f83a80e
          description: Trigger from add-to-cart and quantity update interactions.
          appIds:
            - atelier-storefront
      event:
        source: iglu:com.snowplow_demo.fashion/cart_updated/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow_demo.fashion/product/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/cart/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: 982770b1-da05-5232-9f3e-e80035eb4b64
      name: Checkout started
      description: Fires when the shopper enters the checkout journey from cart.
      triggers:
        - id: 9e40807f-c1c6-4f51-8ac0-0719143c8260
          description: Trigger when the checkout route is first entered.
          appIds:
            - atelier-storefront
      event:
        source: iglu:com.snowplow_demo.fashion/checkout_started/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow_demo.fashion/checkout/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/product/jsonschema/1-0-0
            minCardinality: 0
        enriched: []
    - resourceName: 28360a04-24bd-58c5-b710-f95757111400
      name: Checkout step viewed
      description: Fires when a shopper views an individual checkout step such as shipping or payment.
      triggers:
        - id: 2ffb26a2-95df-42b1-8ed3-d276a1d56e71
          description: Trigger whenever the active checkout stage changes.
          appIds:
            - atelier-storefront
      event:
        source: iglu:com.snowplow_demo.fashion/checkout_step_viewed/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow_demo.fashion/checkout/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/product/jsonschema/1-0-0
            minCardinality: 0
        enriched: []
    - resourceName: 678c719a-2e45-55f4-865e-c7c15e69791b
      name: Checkout completed
      description: Fires when the shopper completes the demo order flow.
      triggers:
        - id: 5248861a-6da3-421c-9c16-b5eaca9abeb2
          description: Trigger when the presenter places the demo order.
          appIds:
            - atelier-storefront
      event:
        source: iglu:com.snowplow_demo.fashion/checkout_completed/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow_demo.fashion/checkout/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/product/jsonschema/1-0-0
            minCardinality: 0
        enriched: []
    # Agent self-tracking. Event schemas resolve from Iglu
    # Central (com.snowplow.agent.tracking, unpublished to this org); entity
    # schemas are the repo's own com.snowplow_demo.fashion data structures.
    # Risk: publishing event specifications that reference Iglu Central
    # schemas has not been tried against a live tracking-plan API from this
    # repo -- see storefront/README.md "Agent event specifications" for the
    # documented fallback if the seed rejects them.
    - resourceName: c746572a-fc8d-5d52-908a-cdd060aaf81e
      name: "Tool execution: search catalog"
      description: >
        Fires for every searchCatalog tool call the concierge makes, with
        the filters used and the result count/ids.
      triggers:
        - id: d68d1f31-aa8b-49b5-a8b8-dfc81d0548d2
          description: Trigger on every searchCatalog tool endpoint call.
          appIds:
            - signals-workshop-fashion-demo-agent
            - signals-workshop-fashion-demo-dev-agent
      event:
        source: iglu:com.snowplow.agent.tracking/tool_execution/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow.agent.tracking/tool_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow.agent.tracking/agent_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/conversation/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/catalog_search/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: bb2e2c15-3498-5ba3-ac8e-5c20fcc5b58d
      name: "Tool execution: get user context"
      description: >
        Fires for every getUserContext tool call the concierge makes, with
        whether Signals returned a profile, recent activity, or a degraded
        payload.
      triggers:
        - id: 7643b030-d782-448f-af5d-e8bb27f1e00f
          description: Trigger on every getUserContext tool endpoint call.
          appIds:
            - signals-workshop-fashion-demo-agent
            - signals-workshop-fashion-demo-dev-agent
      event:
        source: iglu:com.snowplow.agent.tracking/tool_execution/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow.agent.tracking/tool_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow.agent.tracking/agent_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/conversation/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/context_lookup/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: c3e2070a-5413-5114-b0d9-e68365ece187
      name: User intent detected
      description: >
        Fires when the concierge logs the shopper intent it detected for
        the current turn (trackUserIntent self-tracking tool).
      triggers:
        - id: 458800e9-4bf2-418e-9a56-8b92b87d7e4c
          description: Trigger on every trackUserIntent self-tracking tool call.
          appIds:
            - signals-workshop-fashion-demo-agent
            - signals-workshop-fashion-demo-dev-agent
      event:
        source: iglu:com.snowplow.agent.tracking/user_intent_detected/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow.agent.tracking/tool_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow.agent.tracking/agent_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/conversation/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: e84e0d10-ea35-5da4-87ec-da0145dbbe22
      name: Agent decision logged
      description: >
        Fires when the concierge logs a decision it made (trackAgentDecision
        self-tracking tool) -- tool selection, recommendation choice, widget
        choice, clarification needed, or constraint handling.
      triggers:
        - id: b0b1a2e7-3bb9-48c4-b79c-f1a388f03b32
          description: Trigger on every trackAgentDecision self-tracking tool call.
          appIds:
            - signals-workshop-fashion-demo-agent
            - signals-workshop-fashion-demo-dev-agent
      event:
        source: iglu:com.snowplow.agent.tracking/agent_decision_logged/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow.agent.tracking/tool_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow.agent.tracking/agent_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/conversation/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: c72f981c-f3ee-5b26-8ded-7be787472192
      name: Constraint violation
      description: >
        Fires when the concierge logs a shopper requirement the catalog
        could not satisfy (trackConstraintViolation self-tracking tool).
      triggers:
        - id: d0f8cffd-0b4f-4892-ba7b-fe7d9f87f576
          description: Trigger on every trackConstraintViolation self-tracking tool call.
          appIds:
            - signals-workshop-fashion-demo-agent
            - signals-workshop-fashion-demo-dev-agent
      event:
        source: iglu:com.snowplow.agent.tracking/constraint_violation/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow.agent.tracking/tool_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow.agent.tracking/agent_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/conversation/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: 02793aa9-8e4b-595f-bb7e-69f3de1d9641
      name: Message sent
      description: >
        Fires from the chat widget when the shopper sends a message
        (useWidgetConversationTracking).
      triggers:
        - id: 80ea7a76-6c7c-4613-8eb1-9ebbef97cc24
          description: Trigger on every ces-user-input-entered widget event.
          appIds:
            - signals-workshop-fashion-demo
            - signals-workshop-fashion-demo-dev
      event:
        source: iglu:com.snowplow.agent.tracking/message_sent/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow.agent.tracking/message_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/conversation/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
    - resourceName: bded4159-ed24-5cba-b616-2c11cf4838c4
      name: Message received
      description: >
        Fires from the chat widget on the first chunk of the concierge's
        reply for a turn (useWidgetConversationTracking).
      triggers:
        - id: 2f6f8a8e-2f8c-4e0a-9a3a-4a0c6e0d5f2b
          description: >
            Trigger on the first ces-text-received or ces-payload-received
            widget event for a turn.
          appIds:
            - signals-workshop-fashion-demo
            - signals-workshop-fashion-demo-dev
      event:
        source: iglu:com.snowplow.agent.tracking/message_received/jsonschema/1-0-0
      entities:
        tracked:
          - source: iglu:com.snowplow.agent.tracking/message_context/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
          - source: iglu:com.snowplow_demo.fashion/conversation/jsonschema/1-0-0
            minCardinality: 1
            maxCardinality: 1
        enriched: []
