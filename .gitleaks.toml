# gitleaks configuration. Extends the default ruleset. The single allowlist
# below scopes to one deliberately token-shaped fixture inside the redactor
# self-check (a base64 literal exercising the high-entropy detector). It is
# regex-only on purpose: allowlist criteria are ORed, so adding `paths`
# would exempt the whole file and any other leak in it. With this form the
# fixture is suppressed and anything else in the file — or anywhere else —
# still fails the scan.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic token fixture in the redactor self-check"
regexes = ['''QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo\+/aGk=''']
